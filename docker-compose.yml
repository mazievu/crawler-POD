services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: crawler-pod:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      SEARXNG_URL: http://searxng:8080
      PGHOST: ${DOCKER_PGHOST:-172.18.0.1}
      # Everbee-style persistent browser profiles run inside this server
      # container. No client or host Chrome/CDP connection is required.
      EVERBEE_HEADLESS: "true"
      EVERBEE_PROFILE_ROOT: /app/data/everbee-profiles
      CLOAKBROWSER_CACHE_DIR: /app/data/cloakbrowser-cache
      # This is an authenticated local HTTP executor on the Windows host, not CDP.
      EVERBEE_HOST_EXECUTOR_URL: ${EVERBEE_HOST_EXECUTOR_URL:-http://host.docker.internal:9333}
      CDP_URL: ""
    ports:
      - "${HOST_PORT:-9999}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/livez', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # Persistent runtime data
      - ./data:/app/data
      - ./server.js:/app/server.js:ro
      # Static public frontend assets remain read-only
      - ./public:/app/public:ro
      # Dedicated read-write volume for media cache overrides read-only parent mount
      - media_data:/app/public/media
      - ./src:/app/src:ro
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      # Replace this via .env before exposing SearXNG outside the Compose network.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-only-change-this-secret}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng

volumes:
  collector_data:
  searxng_cache:
  media_data:
